version: '3.8'

services:
  db-formatic:
    image: postgres:17-alpine
    container_name: my_postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network

  be-user-formatic:
    build: ./services/user-api
    container_name: my_express_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME_USER=${DB_NAME_USER}
      - ENV_MODE=${ENV_MODE}
      - APP_PORT=${APP_PORT}
      - SECRET=${SECRET}
    depends_on:
      - db-formatic
    restart: always
    networks:
      - app-network

  be-form-formatic:
    build: ./services/form-api
    container_name: my_formatic_backend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME_FORM=${DB_NAME_FORM}
      - ENV_MODE=${ENV_MODE}
      - PORT=${PORT}
      - SECRET=${SECRET}
    depends_on:
      - db-formatic
    volumes:
      - ./services/form-api/uploads:/app/uploads
    restart: always
    networks:
      - app-network

  frontend-form:
    build: ./apps/web
    container_name: my_frontend_form
    ports:
      - "8080:80"
    restart: always
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge

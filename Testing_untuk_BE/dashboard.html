<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Form Publik</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow-sm">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">Jelajahi Form Publik</h1>
                    <span class="text-xs text-slate-400">Pilih formulir atau ujian yang tersedia</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="my-forms.html"
                    class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-folder-open text-indigo-600"></i> Form Saya
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">

        <!-- Global Alert / Notification -->
        <div id="globalAlert" class="hidden p-4 rounded-xl text-sm font-medium border shadow-sm transition"></div>

        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterPublicForms()" placeholder="Cari judul atau topik form..."
                    class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-600 focus:bg-white transition">
            </div>
            <div class="text-xs text-slate-500 font-medium">
                Menampilkan seluruh form dengan status <span class="font-bold text-emerald-600">Publik</span>
            </div>
        </div>

        <!-- Grid Container Form Publik -->
        <div id="publicFormsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Render Kartu Form secara Dinamis via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="text-base font-bold text-slate-900">Belum Ada Form Publik</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Saat ini belum ada formulir publik yang tersedia atau cocok dengan pencarian Anda.</p>
        </div>
    </main>

    <!-- JavaScript Integrasi Backend -->
    <script>
        const API_URL = 'http://localhost:3001';
        let publicFormsList = [];

        function getAuthToken() {
            return localStorage.getItem('token') || '';
        }

        function showGlobalAlert(message, type = 'success') {
            const alertEl = document.getElementById('globalAlert');
            alertEl.className = `p-4 rounded-xl text-sm font-medium border shadow-sm transition ${type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`;
            alertEl.textContent = message;
            alertEl.classList.remove('hidden');
            setTimeout(() => alertEl.classList.add('hidden'), 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPublicForms();
        });

        // Mengambil data seluruh form dari backend dan memfilter yang status setting-nya 'public'
        async function fetchPublicForms() {
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_URL}/form`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || "Gagal memuat daftar form");

                const allForms = result.data || result;
                
                // Menyaring form berdasarkan struktur JSON (setting.status === 'public')
                publicFormsList = Array.isArray(allForms) ? allForms.filter(f => f.setting && f.setting.status === 'public') : [];

                renderPublicForms(publicFormsList);
            } catch (error) {
                console.error(error);
                showGlobalAlert(error.message || "Gagal memuat daftar form publik", "error");
            }
        }

        // Render kartu-kartu form ke grid dashboard
        function renderPublicForms(forms) {
            const gridContainer = document.getElementById('publicFormsGrid');
            const emptyState = document.getElementById('emptyState');
            gridContainer.innerHTML = '';

            const filtered = Array.isArray(forms) ? forms.filter(f => f.setting && f.setting.status === 'public') : [];

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(form => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md hover:border-indigo-300 transition flex flex-col cursor-pointer group";
                
                // Ketika kartu diklik, langsung navigate ke /fill-form dengan parameter slug
                card.onclick = () => {
                    window.location.href = `fill-form.html?slug=${encodeURIComponent(form.slug)}`;
                };

                const bannerImg = form.banner 
                    ? `${API_URL}/${form.banner}` 
                    : 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600';

                // Mengambil sub_kategori dari objek kategori jika tersedia
                const subKategori = form.kategori && form.kategori.sub_kategori ? form.kategori.sub_kategori : 'Umum';

                card.innerHTML = `
                    <div class="h-36 w-full bg-slate-100 overflow-hidden relative">
                        <img src="${bannerImg}" alt="Banner" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-3 right-3 bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-sm">
                            Publik
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2 text-[10px] text-slate-400 font-medium">
                                <span><i class="fa-solid fa-layer-group mr-1"></i> ${subKategori}</span>
                            </div>
                            <h3 class="text-sm font-bold text-slate-900 group-hover:text-indigo-600 transition line-clamp-2">
                                ${form.title || 'Tanpa Judul'}
                            </h3>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                            <span><i class="fa-solid fa-key mr-1 text-slate-400"></i> Token: ${form.token?.token_respon || '-'}</span>
                            <span class="text-indigo-600 font-semibold group-hover:underline flex items-center gap-1">
                                Mulai Isi <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </span>
                        </div>
                    </div>
                `;

                gridContainer.appendChild(card);
            });
        }

        // Fitur Filter Pencarian Sederhana
        function filterPublicForms() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = publicFormsList.filter(f => 
                f.setting && f.setting.status === 'public' && 
                (f.title?.toLowerCase().includes(query) || f.slug?.toLowerCase().includes(query))
            );
            renderPublicForms(filtered);
        }
    </script>
</body>

</html>

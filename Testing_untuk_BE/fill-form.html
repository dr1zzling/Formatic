<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isi Formulir / Ujian</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- MODAL CHECK TOKEN -->
    <div id="tokenModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-5 animate-in fade-in zoom-in duration-200">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900">Verifikasi Token Responden</h3>
                <p class="text-xs text-slate-500">Formulir ini dilindungi token. Masukkan token yang diberikan oleh pembuat form untuk mulai mengerjakan.</p>
            </div>

            <div id="tokenAlert" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

            <form id="tokenForm" onsubmit="handleCheckToken(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Token Responden</label>
                    <input type="text" id="tokenInput" placeholder="Contoh: 120"
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition text-center font-mono tracking-widest text-lg">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="window.location.href='dashboard.html'"
                        class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-xs py-2.5 rounded-xl transition">
                        Kembali
                    </button>
                    <button type="submit" id="btnSubmitToken"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
                        <span>Verifikasi</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="flex-1 flex flex-col hidden">
        <!-- Header Banner / Info -->
        <header id="formHeader" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                <div>
                    <span id="badgeCategory" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">Kategori</span>
                    <h1 id="formTitle" class="text-lg font-bold text-slate-900 mt-1">Judul Form</h1>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Halaman</span>
                    <span id="pageIndicator" class="text-sm font-bold text-indigo-600">1 dari 1</span>
                </div>
            </div>
        </header>

        <!-- Form Content Container -->
        <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
            <div id="globalAlert" class="hidden p-4 rounded-xl text-sm font-medium border shadow-sm transition"></div>

            <!-- Questions Form Container -->
            <form id="questionForm" onsubmit="handleFinishExam(event)" class="space-y-6">
                <div id="questionsContainer" class="space-y-6">
                    <!-- Render Soal Berdasarkan Page Dinamis -->
                </div>

                <!-- Navigation Pagination Buttons -->
                <div class="flex items-center justify-between pt-6 border-t border-slate-200">
                    <button type="button" id="prevBtn" onclick="changePage(-1)"
                        class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-2 shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-arrow-left"></i> Sebelumnya
                    </button>
                    
                    <button type="button" id="nextBtn" onclick="changePage(1)"
                        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2 shadow-sm">
                        Selanjutnya <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <button type="submit" id="submitBtn"
                        class="hidden px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-check"></i> Kirim Jawaban
                    </button>
                </div>
            </form>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_URL = 'http://localhost:3001';
        let formSlug = '';
        let formDataObj = null;
        let pagesData = [];
        let currentPageIndex = 0;
        let userAnswers = {};

        function getAuthToken() {
            return localStorage.getItem('token') || '';
        }

        function showModalAlert(message, type = 'error') {
            const el = document.getElementById('tokenAlert');
            el.className = `p-3 rounded-xl text-xs font-medium border ${type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`;
            el.textContent = message;
            el.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            formSlug = urlParams.get('slug');

            if (!formSlug) {
                alert('Slug form tidak ditemukan!');
                window.location.href = 'dashboard.html';
                return;
            }

            fetchFormDetail();
        });

        // 1. Fetch Detail Form Berdasarkan Slug
        async function fetchFormDetail() {
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_URL}/form/slug?slug=${encodeURIComponent(formSlug)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();

                if (!response.ok) throw new Error(result.message || 'Gagal memuat form');

                formDataObj = result.data.form;
                pagesData = result.data.soal || [];

                document.getElementById('formTitle').textContent = formDataObj.title || 'Tanpa Judul';
                document.getElementById('badgeCategory').textContent = formDataObj.kategori?.sub_kategori || formDataObj.kategori?.primary_kategori || 'Umum';

                checkTokenRequirement();

            } catch (error) {
                console.error(error);
                alert(error.message || 'Terjadi kesalahan saat memuat data form');
                window.location.href = 'dashboard.html';
            }
        }

        // 2. Cek Kebutuhan Token Responden
        async function checkTokenRequirement() {
            const tokenResponRequired = formDataObj.token?.token_respon;

            // Jika token_respon null atau kosong, langsung verifikasi dengan mengirim token null/kosong ke backend
            if (!tokenResponRequired) {
                await verifyTokenAPI(null);
            } else {
                document.getElementById('tokenModal').classList.remove('hidden');
            }
        }

        // Handle Submit Form Token Modal
        async function handleCheckToken(e) {
            e.preventDefault();
            const tokenVal = document.getElementById('tokenInput').value.trim();
            await verifyTokenAPI(tokenVal);
        }

        // Request ke endpoint /form/submit/check-token?form_slug=... (POST) dengan Body { token }
        async function verifyTokenAPI(tokenString) {
            const btn = document.getElementById('btnSubmitToken');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memverifikasi...`;
            }

            try {
                const tokenAuth = getAuthToken();
                // Mengirim form_slug lewat Query Parameter sesuai dengan pipe ValidateFormExist Anda
                const response = await fetch(`${API_URL}/form/submit/check-token?form_slug=${encodeURIComponent(formSlug)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenAuth}`
                    },
                    body: JSON.stringify({
                        token: tokenString
                    })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.message || 'Token Salah / Gagal Verifikasi');

                document.getElementById('tokenModal').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');

                renderCurrentPage();

            } catch (error) {
                console.error(error);
                showModalAlert(error.message || 'Verifikasi gagal', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<span>Verifikasi</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>`;
                }
            }
        }

        // 3. Render Soal Berdasarkan Halaman (Pagination)
        function renderCurrentPage() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            if (pagesData.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl border text-center text-slate-400 text-xs">Belum ada soal pada form ini.</div>`;
                return;
            }

            const currentPageObj = pagesData[currentPageIndex];
            document.getElementById('pageIndicator').textContent = `${currentPageIndex + 1} dari ${pagesData.length}`;

            const pageWrapper = document.createElement('div');
            pageWrapper.className = "space-y-6";

            currentPageObj.soal.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4";

                let optionsHTML = '';
                if (q.options && q.options.length > 0) {
                    q.options.forEach(opt => {
                        const isChecked = userAnswers[q.id] == opt.id ? 'checked' : '';
                        optionsHTML += `
                            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="question_${q.id}" value="${opt.id}" ${isChecked} onchange="saveAnswer(${q.id}, ${opt.id})"
                                    class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                                <span class="text-xs font-medium text-slate-700">${opt.value}</span>
                            </label>
                        `;
                    });
                }

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-lg bg-indigo-50 text-indigo-600 text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                            <span class="text-[10px] text-slate-400 font-medium uppercase">Pilihan Ganda</span>
                        </div>
                    </div>
                    <p class="text-sm font-semibold text-slate-900">${q.question}</p>
                    <div class="space-y-2 pt-2">
                        ${optionsHTML}
                    </div>
                `;

                pageWrapper.appendChild(card);
            });

            container.appendChild(pageWrapper);
            updatePaginationButtons();
        }

        function saveAnswer(soalId, optionId) {
            userAnswers[soalId] = optionId;
        }

        function changePage(direction) {
            const newIndex = currentPageIndex + direction;
            if (newIndex >= 0 && newIndex < pagesData.length) {
                currentPageIndex = newIndex;
                renderCurrentPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updatePaginationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');

            if (currentPageIndex === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentPageIndex === pagesData.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        function handleFinishExam(e) {
            e.preventDefault();
            if (confirm('Apakah Anda yakin ingin mengirimkan jawaban ujian ini?')) {
                alert('Jawaban berhasil diserahkan!');
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>

</html>
